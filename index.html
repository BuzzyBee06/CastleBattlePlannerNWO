<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Battle Planner</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
</head>
<body>

    <div id="app">

        <aside id="sidebar">
    <h2>Players</h2>

    <input
        type="text"
        id="playerSearch"
        placeholder="Search players..."
    >

   <div id="playerList">
    <!-- player names are now loaded automatically from players.json -->
</div>

<button id="clearBtn" disabled>Clear Selected Spot</button>
<button id="clearAllBtn" class="dangerButton">Clear All Player Placements</button>

<div id="zoneControls">
   <div id="zoneModeToggleWrapper">
    <span id="labelPlayerMode" class="toggleModeLabel activeMode">Player Placement</span>
    <label class="toggleSwitch">
        <input type="checkbox" id="zoneModeToggle">
        <span class="toggleSlider"></span>
    </label>
    <span id="labelZoneMode" class="toggleModeLabel">Zone Editing</span>
</div>

    <div id="zoneModeOptions" style="display:none;">
        <div id="zoneActionRow">
            <label><input type="radio" name="zoneAction" value="paint" checked> Paint</label>
            <label><input type="radio" name="zoneAction" value="erase"> Erase</label>
        </div>
        <select id="zoneSelect"></select>
        <button id="addZoneBtn">+ New Zone</button>
        <button id="clearAllZonesBtn" class="dangerButton">Clear All Zones</button>
    </div>
</div>

<div id="rallyControls">
    <label for="rallySelect">Rally:</label>
    <select id="rallySelect"></select>
    <button id="setRallyBtn">Set Rally for Selected</button>
    <button id="clearAllRalliesBtn" class="dangerButton">Clear All Rally Assignments</button>
</div>

<button id="exportBtn">Export as PDF</button>
<button id="saveProjectBtn">Save Project</button>
<button id="loadProjectBtn">Load Project</button>
<input type="file" id="loadProjectInput" accept=".json" style="display:none">
<button id="resetPageBtn" style="background:#ffdddd; border:1px solid #cc4444;">Reset Page</button>

</aside>

        <main id="mainContent">

            <header>
                <h1>Castle Battle Planner</h1>
            </header>

            <div id="mapWrapper">

                <div id="zoomControls">
                    <span id="zoomLabel">Add/Remove Rows</span>
                    <div id="zoomButtonRow">
                        <button id="zoomOutBtn" title="Remove a row (bigger tiles)">−</button>
                        <button id="zoomInBtn" title="Add a row (smaller tiles)">+</button>
                    </div>
                </div>

                <canvas id="battleMap"></canvas>

               </div>

            <<details id="zoneOverview" open>
    <summary><h2 style="display:inline;">Zone Overview</h2></summary>
    <div id="zoneOverviewList"></div>
</details>

<details id="rallyOverview">
    <summary><h2 style="display:inline;">Rally Overview</h2></summary>
    <div id="rallyOverviewList"></div>
</details>

<details id="notesSection">
    <summary><h2 style="display:inline;">Notes</h2></summary>

    <input type="text" id="notesTitleInput" class="notesTitleInput" value="Notes">

    <div id="notesEditorWrapper">
        <div id="notesEditor"></div>
    </div>
</details>

   </div>


   

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
